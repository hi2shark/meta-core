name: Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - nw
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ohmycggk/clash-meta-nw

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          SKIP_INTEROP_TEST: "1"
          SKIP_CONCURRENT_TEST: "1"
        run: |
          go test ./... -count=1
          go test ./... -tags with_gvisor -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs:
          - { goos: linux, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: linux, goarch: amd64, goamd64: v2, output: amd64-v2 }
          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: darwin, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: darwin, goarch: amd64, goamd64: v2, output: amd64-v2 }
          - { goos: darwin, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: darwin, goarch: arm64, output: arm64 }
          - { goos: windows, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: windows, goarch: amd64, goamd64: v2, output: amd64-v2 }
          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: windows, goarch: arm64, output: arm64 }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="nw-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date -u)" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          GOAMD64: ${{ matrix.jobs.goamd64 }}
          OUTPUT: ${{ matrix.jobs.output }}
        run: |
          set -euo pipefail
          if [ -z "${GOAMD64}" ]; then
            unset GOAMD64
          fi
          OUT="clash-meta-nw-${GOOS}-${OUTPUT}"
          LDFLAGS="-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          if [ "${GOOS}" = "windows" ]; then
            go build -trimpath -tags with_gvisor -ldflags "${LDFLAGS}" -o "${OUT}.exe"
            zip -j "${OUT}-${VERSION}.zip" "${OUT}.exe"
          else
            go build -trimpath -tags with_gvisor -ldflags "${LDFLAGS}" -o "${OUT}"
            if [ "${GOOS}" = "linux" ]; then
              cp "${OUT}" clash
              chmod +x clash
              tar -czf "clash-linux-${OUTPUT}.tar.gz" clash
              rm clash
            fi
            chmod +x "${OUT}"
            gzip -c "${OUT}" > "${OUT}-${VERSION}.gz"
            rm "${OUT}"
          fi
          printf '%s' "${VERSION}" > version.txt

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          if-no-files-found: warn
          path: |
            clash-meta-nw*
            clash-linux-*.tar.gz

      - name: Archive version
        if: matrix.jobs.goos == 'linux' && matrix.jobs.output == 'amd64-v1'
        uses: actions/upload-artifact@v7
        with:
          name: linux-version
          path: version.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Checksums and OpenClash bundle
        run: |
          set -euo pipefail
          cd bin
          VERSION="$(cat version.txt)"
          zip -j "openclash-${VERSION}.zip" \
            clash-linux-amd64-v1.tar.gz \
            clash-linux-amd64-v2.tar.gz \
            clash-linux-amd64-v3.tar.gz \
            clash-linux-arm64.tar.gz
          find . -type f -not -name "checksums.txt" -not -name "version.txt" | sort | xargs sha256sum > checksums.txt
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Delete previous prerelease
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "Prerelease-nw" --yes --cleanup-tag || true

      - name: Upload prerelease
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Prerelease-nw
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: bin/*
          body: |
            Prerelease of the nw branch. This tag keeps only the latest build.
            OpenClash cores are clash-linux-*.tar.gz. The universal package is openclash-${{ env.VERSION }}.zip.

      - name: Generate release notes
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --tags
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PREVERSION="$(git describe --tags --abbrev=0 "${{ github.sha }}^" 2>/dev/null || true)"
          else
            PREVERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [ -n "${PREVERSION}" ]; then
            bash ./.github/genReleaseNote.sh -v "${PREVERSION}...${{ github.sha }}"
          else
            echo "Release ${VERSION}" > release.md
          fi

      - name: Tag release
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Upload release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: bin/*
          body_path: release.md

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: bin/
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=nw,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=raw,value=${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version || 'unused' }},enable=${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
